version: 2
# meta.serve: copy into Doris. meta.key: the Doris key and distribution column.
# dim_provider and fact_claim are the person-level core the marts are built from; they are not served.
models:
  - name: dim_provider
    description: Provider directory entries, SCD type 2 (one row per version), kept incrementally from Bronze.
    config: {meta: {history_source: provider_directory}}  # loader/gold.py: history_horizons
  - name: dim_patient
    description: Clinic patients, SCD type 2 (one row per version), kept incrementally from the CDC feed in Bronze.
    config: {meta: {history_source: acme_clinic_patients}}
  - name: fact_claim
    description: One row per claim (current version), with the provider version valid on its service date.
  - name: fact_lab_result
    description: One row per lab result from every lab source, with the value in the test's standard unit.
  - name: claims_monthly
    config: {meta: {serve: true, key: service_month}}
  - name: provider_activity
    config: {meta: {serve: true, key: provider_npi}}
  - name: lab_monthly
    config: {meta: {serve: true, key: test_code}}
  - name: member_claims
    config: {meta: {serve: true, key: subject_id}}
