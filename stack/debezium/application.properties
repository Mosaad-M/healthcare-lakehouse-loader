# Debezium Server: the source Postgres's changes to the cdc-sink receiver over HTTP.
# (On AWS, DMS writes the change files to S3 directly.)
debezium.sink.type=http
debezium.sink.http.url=http://cdc-sink:8090/events
debezium.sink.http.retries=10
debezium.sink.http.retry.interval.ms=2000

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.database.hostname=source-pg
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=${POSTGRES_PASSWORD}
debezium.source.database.dbname=clinic
debezium.source.topic.prefix=clinic
debezium.source.table.include.list=public.patients
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=lakehouse
debezium.source.publication.autocreate.mode=filtered
debezium.source.decimal.handling.mode=string
debezium.source.snapshot.mode=initial

# One flat JSON object per change: the row (after, or before for deletes) plus __op, __lsn, __txId.
debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false
debezium.transforms=unwrap
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.add.fields=op,lsn,txId
debezium.transforms.unwrap.delete.tombstone.handling.mode=rewrite
quarkus.log.level=WARN
