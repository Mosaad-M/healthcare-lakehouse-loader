[project]
name = "lakehouse-loader"
version = "0.1.0"
description = "Load regulated health data into an Apache Iceberg lakehouse (Polaris, DuckDB, Doris, Spark, Prefect)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==2.0.0",
    "boto3>=1.40",
    "prefect==3.8.8",
    "pyspark-client==4.1.3",
    "pymysql>=1.1",
    "pydantic>=2.7",
    "pyyaml>=6",
    "cryptography>=43",
    "dbt-duckdb==1.11.0",
    "aiosmtpd>=1.4",
    "confluent-kafka>=2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.130",
    "pytest-cov>=6.0",
    "psycopg>=3.2",  # CDC tests write to the source database; libpq from Debian (toolbox image)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "doris: needs the Doris services (separate CI job)",
    "aws: needs the AWS sandbox (make sandbox-test)",
    "local: needs the local stack (Spark Connect, RustFS)",
]
